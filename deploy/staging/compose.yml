name: devops-health-staging 

services: 
    app: 
      image: "${APP_IMAGE:?APP_IMAGE must be set}" 
      ports: 
          - "8000:8000" 
      restart: unless-stopped
      environment: 
            PYTHONUNBUFFERED: "1" 
      logging: 
           driver: json-file 
           options: 
               max-size: "10m" 
               max-file: "3"  
      healthcheck: 
            test: 
               - CMD
               - python 
               - -c 
               - >-
                 import urllib.request; 
                 r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3);
                 raise SystemExit(0 if r.status == 200 else 1) 
            interval: 10s 
            timeout: 5s 
            retries: 3 
            start_period: 15s 
