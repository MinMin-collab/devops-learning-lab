name: Basic repository check 
on: 
 pull_request: 
  branches: [main]
 push: 
  branches: [main]

jobs:
  repo-check: 
      runs-on: ubuntu-latest
      steps:
         - name: Check out repository
           uses: actions/checkout@v4
         
         - name: Set up Python 
           uses: actions/setup-python@v5 
           with: 
              python-version: "3.12" 

         - name: Verify REAME title 
           run: grep -q '^# DevOps Learning Lab' README.md
        
         - name: Run unit tests
           run: python -m unittest discover -s tests -v

