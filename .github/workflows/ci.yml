name: Basic repository check 
on: 
 pull_request: 
  branches: [main]
 push: 
  branches: [main]

jobs:
   test: 
      name: Check repository and Python tests
      runs-on: ubuntu-latest
      steps:
         - name: Check out repository
           uses: actions/checkout@v4
         
         - name: Set up Python 
           uses: actions/setup-python@v5 
           with: 
              python-version: "3.12" 

         - name: Verify REAME title 
           run: grep -q '^# DevOps Learning Lab' README.md
        
         - name: Run Python tests
           run: python -m unittest discover -s tests -v
   publish: 
       name: Build, smoke test and publish  
       needs: test 
       runs-on: ubuntu-latest
       env: 
         TEST_IMAGE: devops-health-lab:smoke

       steps: 
          - name: Check out repository
            uses: actions/checkout@v4
         
          - name: Set up Python for smoke test
            uses: actions/setup-python@v5      
         
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Build image locally
            uses: docker/build-push-action@v6
            with: 
               context: . 
               load: true 
               push: false
               tags: ${{ env.TEST_IMAGE }}

          - name: Smoke Test 
            shell: bash 
            timeout-minutes: 2 
            run: bash scripts/smoke-test.sh "$TEST_IMAGE"

          - name: Generate release tags 
            if: github.event_name == 'push' && github.ref == 'ref/heads/main'
            id: meta
            uses: docker/metadata-action@v5
            with: 
               images: minmin203/devops-health-lab
               tags: | 
                 type=raw,value=latest
                 type=sha,prefix=sha-
 
          - name: Log in to Docker Hub
            if: github.event_name == 'push'&& github.ref == 'ref/heads/main'
            uses: docker/login-action@v3 
            with: 
               username: ${{ secrets.DOCKERHUB_USERNAME }} 
               password: ${{ secrets.DOCKERHUB_TOKEN }} 

          - name: Push tested image 
            if: github.event_name == 'push' &&  github.ref == 'ref/heads/main'
            shell: bash
            env:
              IMAGE_TAGS: ${{ steps.meta.outpush.tags }}
            run: | 
              set -euo pipefail
              test -n "$IMAGE_TAGS" 
               
              while IFS= read -r tag; do
                 [[ -z "$tag" ]] && continue
                 docker tag "$TEST_IMAGE" "$tag"
                 docker push "$tag"
              done <<< "$IMAGE_TAGS" 
 
                 
            
                
